<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="globeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a73e8" />
      <stop offset="100%" stop-color="#0d47a1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="64" cy="64" r="56" fill="url(#globeGrad)" filter="url(#shadow)" />
  <!-- Grid Lines -->
  <circle cx="64" cy="64" r="56" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.2"/>
  <ellipse cx="64" cy="64" rx="28" ry="56" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5"/>
  <line x1="8" y1="64" x2="120" y2="64" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5"/>
  <line x1="64" y1="8" x2="64" y2="120" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.5"/>
  <ellipse cx="64" cy="40" rx="46" ry="12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  <ellipse cx="64" cy="88" rx="46" ry="12" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  <!-- Map Pin Center -->
  <circle cx="64" cy="64" r="14" fill="#ea4335" stroke="#ffffff" stroke-width="3"/>
  <circle cx="64" cy="64" r="5" fill="#ffffff"/>
</svg>
