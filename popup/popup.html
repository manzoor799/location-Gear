<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Location Gear</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- Top Navigation Header -->
  <div class="header">
    <div class="logo">
      <span class="logo-icon">🌍</span>
      <h1>Location Gear</h1>
    </div>
    <div class="header-right">
      <button type="button" class="btn-master-reset-compact" id="master-reset-btn" title="Toggle Location Spoofing">
        <span class="btn-icon">⏻</span>
        <span id="master-btn-text">Turn Off</span>
      </button>
      <div class="toggle-status-wrap">
        <span class="status-label" id="status-label">ACTIVE</span>
        <label class="switch mini" title="Toggle Location Spoofing">
          <input type="checkbox" id="spoof-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Active Region Card (Slim & Integrated) -->
  <div class="active-card" id="active-card">
    <div class="active-content">
      <span class="active-flag" id="active-flag">🇺🇸</span>
      <div class="active-info">
        <div class="active-title-row">
          <h2 id="active-name">United States (US)</h2>
          <span class="tier-pill t1" id="active-tier">Tier 1</span>
        </div>
        <div class="active-meta-row">
          <span id="active-coords">37.0902°, -95.7129°</span>
          <span class="meta-dot">•</span>
          <span class="active-time-pill" id="active-time" title="Current local time in target country">🕒 --:--</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Quick Select Favorites Bar (Single Inline Line) -->
  <div class="favorites-section">
    <span class="favorites-label">⚡ Quick:</span>
    <div class="favorite-chips" id="favorite-chips">
      <!-- Injected via popup.js: US, UK, CA, AU, DE -->
    </div>
  </div>

  <!-- Search Section -->
  <div class="search-section">
    <input type="text" id="popup-search" placeholder="🔍 Search 196 countries, codes, cities..." autocomplete="off">
  </div>

  <!-- Language Market Filters -->
  <div class="language-section">
    <div class="language-header">
      <span class="section-title">Language Markets</span>
      <span class="lang-active-indicator" id="lang-active-indicator">All Languages</span>
    </div>
    <div class="language-chips" id="language-chips">
      <button type="button" class="lang-chip active" data-lang="all">All</button>
      <button type="button" class="lang-chip" data-lang="es"><span>🇪🇸</span> Spanish (6)</button>
      <button type="button" class="lang-chip" data-lang="de"><span>🇩🇪</span> German (3)</button>
      <button type="button" class="lang-chip" data-lang="fr"><span>🇫🇷</span> French (6)</button>
      <button type="button" class="lang-chip" data-lang="pt"><span>🇵🇹</span> Portuguese (4)</button>
      <button type="button" class="lang-chip" data-lang="it"><span>🇮🇹</span> Italian (2)</button>
    </div>
  </div>

  <!-- Tier Filter Tabs (Segmented Control) -->
  <div class="tabs-wrapper">
    <div class="tabs" role="tablist">
      <button type="button" class="tab-btn active" data-tier="all">All (196)</button>
      <button type="button" class="tab-btn" data-tier="1">Tier 1 (24)</button>
      <button type="button" class="tab-btn" data-tier="2">Tier 2 (36)</button>
      <button type="button" class="tab-btn" data-tier="3">Tier 3 (136)</button>
    </div>
  </div>

  <!-- Scrollable Country List (Now Expanded & Dominant) -->
  <div class="list-container">
    <ul id="popup-country-list">
      <!-- Injected via popup.js -->
    </ul>
  </div>

  <!-- Unified Bottom Control & Action Bar (Saves 45px) -->
  <div class="bottom-action-bar">
    <div class="langlock-compact" title="Forces Google search UI to remain in English (hl=en)">
      <label class="switch mini">
        <input type="checkbox" id="toggle-langlock" checked>
        <span class="slider round"></span>
      </label>
      <span class="langlock-label">English UI (hl=en)</span>
    </div>
    <button type="button" class="btn-open-google" id="open-google-btn">
      <span>🚀 Open Google</span>
    </button>
  </div>

  <!-- Footer Reassurance -->
  <div class="footer">
    <span class="footer-guarantee">🛡️ Zero-Lag gl Engine • 0 CAPTCHAs</span>
    <span class="footer-version">v1.2.0</span>
  </div>

  <script src="../data/countries.js"></script>
  <script src="popup.js"></script>
</body>
</html>
